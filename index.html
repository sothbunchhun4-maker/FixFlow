    function timeAgo(ts) {
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return Math.floor(diff / 86400) + 'd ago';
    }

    function showToast(msg, type) {
      const colors = {
        success: { bg: 'rgba(16,185,129,0.15)', border: 'rgba(16,185,129,0.4)', icon: '#34d399' },
        info: { bg: 'rgba(6,182,212,0.15)', border: 'rgba(6,182,212,0.4)', icon: '#22d3ee' },

      };
      const c = colors[type] || colors.info;
      const id = 'toast-' + Date.now();
      const html = `<div id="${id}" class="pointer-events-auto glass-strong rounded-xl px-4 py-3 flex items-center gap-3 anim-slide-right" style="background:${c.bg};border-color:${c.border}">
        <div class="w-2 h-2 rounded-full anim-pulse-dot" style="background:${c.icon}"></div>
        <span class="text-sm text-slate-200">${msg}</span>
      </div>`;
      document.getElementById('toast-container').insertAdjacentHTML('beforeend', html);
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) { el.style.opacity = '0'; el.style.transform = 'translateX(60px)'; el.style.transition = 'all 0.3s'; setTimeout(() => el.remove(), 300); }

    }

    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      canvas.classList.remove('hidden');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ['#06b6d4', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#14b8a6', '#22d3ee'];
      const particles = [];
      for (let i = 0; i < 180; i++) {
        particles.push({
          x: window.innerWidth / 2, y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 18, vy: (Math.random() - 0.5) * 18 - 8,
          size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 12, gravity: 0.35,
        });
      }
      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.rotation += p.rotSpeed;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation * Math.PI / 180);
          ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        });
        frame++;
        if (frame < 150) requestAnimationFrame(animate);
        else { ctx.clearRect(0, 0, canvas.width, canvas.height); canvas.classList.add('hidden'); }
      }
      animate();
    }

    let aiPhotoData = null;
    function handleAIPhoto(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        aiPhotoData = e.target.result;
        const preview = document.getElementById('ai-photo-preview');
        const placeholder = document.getElementById('ai-photo-placeholder');
        if (preview && placeholder) {
          preview.innerHTML = `<img src="${aiPhotoData}" class="w-full h-40 object-cover" alt="Equipment photo"/>`;
          preview.classList.remove('hidden');
          placeholder.classList.add('hidden');
        }
      };
      reader.readAsDataURL(file);
    }

    function submitAIReport() {
      const issue = document.getElementById('ai-issue-text')?.value.trim();
      if (!issue) { showToast('Please describe the problem first', 'warning'); return; }
      const photo = aiPhotoData || svgReportPhoto(Math.floor(Math.random() * 4));
      const assets = [
        { name: 'Espresso Machine #07', loc: 'Café Aurelia, BKK1' },
        { name: 'Commercial Blender #02', loc: 'Smoothie Bar, Toul Kork' },
        { name: 'Refrigerator Unit #03', loc: 'Kitchen, Daun Penh' },
        { name: 'Dishwasher #01', loc: 'Café Aurelia, BKK1' },
      ];
      const a = assets[Math.floor(Math.random() * assets.length)];
      const conf = (95 + Math.random() * 4.5).toFixed(1);
      state.tickets.unshift({
        id: 'FF-' + String(2400 + state.tickets.length + 1).padStart(4, '0'),
        asset: a.name, assetCode: a.name.split('#')[1] ? a.name.split('#')[1].trim() : 'XX-00',
        location: a.loc, issue, method: 'AI Photo', photo,
        time: Date.now(), status: 'Pending', reporter: 'You', aiConfidence: parseFloat(conf),
        repairerType: null, repairerId: null, repairerName: null, timerStart: null,
        chat: [], price: null, priceOffered: null, priceAgreed: false, accepted: false,
        proofPhoto: null, completedAt: null,
      });
      aiPhotoData = null;
      hideModal();
      render();
      showToast('AI report submitted — equipment identified at ' + conf + '% confidence', 'success');

    function dispatchToInHouse(ticketId, staffId) {
      const t = state.tickets.find(x => x.id === ticketId);
      const s = inHouseStaff.find(x => x.id === staffId);
      if (!t || !s) return;
      t.status = 'In Progress';
      t.repairerType = 'inhouse';
      t.repairerId = staffId;
      t.repairerName = s.name;
      t.timerStart = Date.now();
      s.status = 'Busy';
      hideModal();
      render();
      showToast(`Dispatched to ${s.name} (In-House, FREE)`, 'success');
    }

    function dispatchToContractor(ticketId, contractorId) {
      const t = state.tickets.find(x => x.id === ticketId);
      const c = contractors.find(x => x.id === contractorId);
      if (!t || !c) return;
      t.status = 'Negotiating';
      t.repairerType = 'contractor';
      t.repairerId = contractorId;
      t.repairerName = c.name;
      t.chat = [];
      t.price = null;
      t.priceAgreed = false;
      t.accepted = false;
      hideModal();
      render();
      showToast(`Dispatched to ${c.name} — negotiate price to begin`, 'info');
      setTimeout(() => showChatModal(ticketId), 300);
    }

    // ─── CHAT MODAL ───
    function showChatModal(ticketId) {
      state.activeChat = ticketId;
      renderChatModal();
    }

    function renderChatModal() {
      const t = state.tickets.find(x => x.id === state.activeChat);
      if (!t) return hideModal();
      const isContractorJob = t.repairerType === 'contractor';
      const isManager = state.role === 'manager';
      const isContractor = state.role === 'contractor';
      const isTech = state.role === 'inhouse';
      const isStaff = state.role === 'staff';
      const mySide = isManager ? 'manager' : isContractor ? 'contractor' : isTech ? 'tech' : 'staff';
      const otherName = t.repairerType === 'inhouse' ? t.repairerName : t.repairerName || 'Manager';
      const showPriceNeg = isContractorJob && (isManager || isContractor);
      showModal(`
        <div class="glass-strong rounded-2xl max-w-md mx-auto flex flex-col" style="max-height:85vh">
          <div class="p-4 border-b border-accent-500/10 flex items-center justify-between">
            <div class="flex items-center gap-2 min-w-0">
              <div class="w-9 h-9 rounded-full overflow-hidden flex-shrink-0">${t.repairerType === 'inhouse' ? svgAvatar(inHouseStaff.find(s => s.id === t.repairerId)?.seed || 0, t.repairerName) : svgLogo(contractors.find(c => c.id === t.repairerId)?.seed || 0, t.repairerName)}</div>
              <div class="min-w-0">
                <h3 class="font-semibold text-sm truncate">${t.repairerName || 'Chat'}</h3>
                <p class="text-xs text-slate-500">${t.asset}</p>
              </div>
            </div>
            <button onclick="hideModal()" class="text-slate-500 hover:text-slate-300 flex-shrink-0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>
          ${showPriceNeg && !t.priceAgreed ? `
          <div class="px-4 py-2.5 border-b border-accent-500/10 glass">
            <div class="flex items-center justify-between text-xs">
              <span class="text-violet-300 font-medium">Price Negotiation</span>
              <span class="text-slate-400">${t.priceOffered ? 'Offered: $' + t.priceOffered : 'No offer yet'}</span>
            </div>
          </div>` : ''}
          <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 min-h-[200px]">
            ${t.chat.length === 0 ? `<p class="text-center text-xs text-slate-600 py-8">No messages yet. Start the conversation.</p>` : t.chat.map(m => chatMessage(m, mySide)).join('')}
          </div>
          ${showPriceNeg && isManager && !t.priceAgreed ? `
          <div class="p-3 border-t border-accent-500/10">
            <div class="flex gap-2 mb-2">
              <input type="number" id="price-input" placeholder="Offer price ($)" min="0" />
              <button onclick="proposePrice('${t.id}')" class="btn-primary px-4 py-2.5 rounded-lg text-sm font-semibold whitespace-nowrap">Propose</button>
            </div>
          </div>` : ''}
          ${showPriceNeg && isContractor && !t.priceAgreed ? `
          <div class="p-3 border-t border-accent-500/10">
            <div class="flex gap-2 mb-2">
              <input type="number" id="counter-price-input" placeholder="Counter-offer ($)" min="0" />
              <button onclick="counterPrice('${t.id}')" class="btn-ghost px-4 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap">Counter</button>
            </div>
          </div>` : ''}
          <div class="p-3 border-t border-accent-500/10">
            <div class="flex gap-2">
              <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChatMessage('${t.id}')" />
              <button onclick="sendChatMessage('${t.id}')" class="btn-primary px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center gap-1.5 flex-shrink-0">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>
        </div>
      `);
      setTimeout(() => { const el = document.getElementById('chat-messages'); if (el) el.scrollTop = el.scrollHeight; }, 50);
    }

    function chatMessage(m, mySide) {
      const isMe = m.from === mySide || (mySide === 'staff' && m.from === 'staff');
      const side = isMe ? 'justify-end' : 'justify-start';
      const bg = m.type === 'price' ? 'rgba(245,158,11,0.15)' : m.type === 'counter' ? 'rgba(168,85,247,0.15)' : m.type === 'accept' ? 'rgba(16,185,129,0.15)' : m.type === 'decline' ? 'rgba(239,68,68,0.15)' : isMe ? 'rgba(6,182,212,0.15)' : 'rgba(59,130,246,0.1)';
      const border = m.type === 'price' ? 'rgba(245,158,11,0.3)' : m.type === 'counter' ? 'rgba(168,85,247,0.3)' : m.type === 'accept' ? 'rgba(16,185,129,0.3)' : m.type === 'decline' ? 'rgba(239,68,68,0.3)' : isMe ? 'rgba(6,182,212,0.2)' : 'rgba(59,130,246,0.15)';
      return `<div class="flex ${side}"><div class="max-w-[75%] rounded-xl px-3 py-2" style="background:${bg};border:1px solid ${border}">
        ${m.type === 'price' ? `<div class="text-xs text-amber-400 font-semibold mb-0.5">Price Offered</div><div class="text-sm font-bold text-amber-300">$${m.amount}</div>` : m.type === 'counter' ? `<div class="text-xs text-violet-400 font-semibold mb-0.5">Counter-Offer</div><div class="text-sm font-bold text-violet-300">$${m.amount}</div>` : m.type === 'accept' ? `<div class="text-sm text-green-400 font-semibold">Accepted — Price agreed at $${m.amount}</div>` : m.type === 'decline' ? `<div class="text-sm text-red-400 font-semibold">Job Declined</div>` : `<p class="text-sm text-slate-200">${m.text}</p>`}
        <div class="text-[10px] text-slate-500 mt-1 text-right">${timeAgo(m.time)}</div>
      </div></div>`;
    }

    function sendChatMessage(ticketId) {
      const input = document.getElementById('chat-input');
      if (!input || !input.value.trim()) return;
      const t = state.tickets.find(x => x.id === ticketId);
      if (!t) return;
      const from = state.role === 'manager' ? 'manager' : state.role === 'contractor' ? 'contractor' : state.role === 'inhouse' ? 'tech' : 'staff';
      t.chat.push({ from, text: input.value.trim(), type: 'text', time: Date.now() });
      input.value = '';
      renderChatModal();

    }

    function proposePrice(ticketId) {
      const input = document.getElementById('price-input');
      if (!input || !input.value) { showToast('Enter a price first', 'warning'); return; }
      const amount = parseFloat(input.value);
      const t = state.tickets.find(x => x.id === ticketId);
      if (!t) return;
      t.priceOffered = amount;
      t.chat.push({ from: 'manager', type: 'price', amount, time: Date.now() });
      renderChatModal();

    }

    function counterPrice(ticketId) {
      const input = document.getElementById('counter-price-input');
      if (!input || !input.value) { showToast('Enter a counter-offer', 'warning'); return; }
      const amount = parseFloat(input.value);
      const t = state.tickets.find(x => x.id === ticketId);
      if (!t) return;
      t.chat.push({ from: 'contractor', type: 'counter', amount, time: Date.now() });
      renderChatModal();

    }

    function acceptContract(ticketId) {
      const t = state.tickets.find(x => x.id === ticketId);
      if (!t) return;
      if (!t.priceOffered) { showToast('No price offer to accept', 'warning'); return; }
      t.price = t.priceOffered;
      t.priceAgreed = true;
      t.accepted = true;
      t.status = 'In Progress';
      t.timerStart = Date.now();
      t.chat.push({ from: 'contractor', type: 'accept', amount: t.priceOffered, time: Date.now() });
      render();
      showToast(`Job accepted at $${t.price} — repair started!`, 'success');
    }

    function declineContract(ticketId) {
      const t = state.tickets.find(x => x.id === ticketId);
      if (!t) return;
      t.chat.push({ from: 'contractor', type: 'decline', time: Date.now() });
      t.status = 'Pending';
      t.repairerType = null;
      t.repairerId = null;
      t.repairerName = null;
      render();
      showToast('Job declined — returned to pending queue', 'warning');
    }

    function completeJob(ticketId) {
      const t = state.tickets.find(x => x.id === ticketId);
      if (!t) return;
      t.status = 'Completed';
      t.completedAt = Date.now();
      t.proofPhoto = svgReportPhoto(Math.floor(Math.random() * 4));
      const s = inHouseStaff.find(x => x.id === t.repairerId);
      if (s) s.status = 'Available';
      launchConfetti();
      render();
      showToast('Repair completed and saved to history!', 'success');
    }

    function finishContract(ticketId) {
      const t = state.tickets.find(x => x.id === ticketId);
      if (!t) return;
      t.status = 'Completed';
      t.completedAt = Date.now();
      t.proofPhoto = svgReportPhoto(Math.floor(Math.random() * 4));
      launchConfetti();
      render();
      showToast('Contract finished — invoice submitted for $' + t.price, 'success');
    }

    // ─── TIMER SYSTEM ───
    function startTimerSystem() {
      setInterval(() => {
        document.querySelectorAll('[data-timer-start]').forEach(el => {
          const start = parseInt(el.dataset.timerStart);
          if (start) el.textContent = formatTimer(Math.floor((Date.now() - start) / 1000));
        });
      }, 1000);
    }

    // ─── INIT ───
    function init() {
      initData();
      render();
      startTimerSystem();
    }

    // Close modal on backdrop click
    document.addEventListener('click', (e) => {
      const m = document.getElementById('modal-root');
      if (e.target === m) hideModal();
    });

    // Escape key closes modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideModal();
    });

    init();
    </script>
  </body>
</html>
